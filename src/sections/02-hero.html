<!--
  02 — Hero.

  Art direction, not video, carries the opening. The film is an optional
  secondary experience behind a CTA (see 14-video-modal.html); nothing here
  depends on it loading, and the page is complete without it.

  Composition: the wordmark runs off the left edge across two lines; the
  product sits right of centre inside a soft-edged lens; a large iridescent
  orb enters from the right and bleeds off-viewport; a second orb drifts
  behind the type. Depth comes from four planes moving at different rates.
-->
<section
  class="rv-hero"
  id="rv-top"
  data-rv-scene="hero"
  data-rv-ground="ice"
  data-rv-span="2.4"
>
  <div class="rv-hero__stage" data-rv-stage>
    <!-- Plane 1 — atmosphere and forms -->
    <div class="rv-scene rv-hero__scene">
      <span
        class="rv-wash rv-hero__field rv-drift"
        style="--rv-wash-tint: var(--rv-atm-1); --rv-drift-y: -80px"
      ></span>
      <span
        class="rv-orb rv-hero__orb rv-hero__orb--major rv-drift rv-pointer"
        style="--rv-orb-tint: #6fb6de; --rv-drift-y: -150px; --rv-pointer-x: 26px; --rv-pointer-y: 18px"
      ></span>
      <span
        class="rv-orb rv-hero__orb rv-hero__orb--minor rv-drift rv-pointer"
        style="--rv-orb-tint: #b9a6dd; --rv-drift-y: 120px; --rv-pointer-x: -34px; --rv-pointer-y: -22px"
      ></span>
      <span class="rv-arc rv-hero__arc rv-drift" style="--rv-drift-y: -60px"></span>
      <span
        class="rv-blob rv-blob--morph rv-hero__blob rv-drift"
        style="--rv-blob-tint: #cfe6f2; --rv-drift-y: 90px"
      ></span>
    </div>

    <div class="rv-hero__inner rv-above">
      <!-- Plane 2 — oversized wordmark, cropped by the left edge -->
      <h1 class="rv-hero__title" aria-label="RENUVOL">
        <span class="rv-hero__word rv-hero__word--lead" aria-hidden="true">RENU</span>
        <span class="rv-hero__word rv-hero__word--trail" aria-hidden="true">VOL</span>
      </h1>

      <!-- Plane 3 — the product as a sculptural object -->
      <figure class="rv-hero__product rv-pointer" style="--rv-pointer-x: -18px; --rv-pointer-y: -12px">
        <span class="rv-hero__lens" aria-hidden="true"></span>
        <img
          class="rv-hero__vial"
          src="/images/product/renuvol-vial.webp"
          alt="Флакон RENUVOL"
          width="536"
          height="1328"
          fetchpriority="high"
          decoding="async"
        />
        <span class="rv-iris rv-hero__wash" aria-hidden="true"></span>
      </figure>

      <!-- Plane 4 — copy -->
      <div class="rv-hero__copy">
        <div class="rv-hero__cue rv-hero__cue--lead" data-rv-cue="0 0.46 0">
          <p class="rv-hero__statement">Кожа, которая снова<br />умеет восстанавливаться.</p>
          <p class="rv-hero__support">
            Инновационный препарат для работы с качеством кожи.<br />
            Южная Корея<span class="rv-slash">/</span>профессиональная эстетическая медицина.
          </p>
          <div class="rv-hero__actions">
            <a class="rv-btn rv-btn--solid" href="#rv-formula">Узнать о препарате</a>
            <a class="rv-btn rv-btn--ghost" href="#rv-selection">Запросить условия сотрудничества</a>
          </div>
          <button class="rv-filmlink" type="button" data-rv-video-open>
            <span class="rv-filmlink__icon" aria-hidden="true"></span>
            Смотреть фильм о RENUVOL
          </button>
        </div>

        <div class="rv-hero__cue rv-hero__cue--trail" data-rv-cue="0.62 1 0.14 0">
          <p class="rv-hero__line">
            5 компонентов<span class="rv-hero__dash">—</span>одна система
          </p>
        </div>
      </div>
    </div>

    <div class="rv-hero__scroll" data-rv-cue="0 0.08 0">
      <span class="rv-hero__scroll-label">Scroll to discover</span>
      <span class="rv-hero__scroll-line" aria-hidden="true"></span>
    </div>
  </div>
</section>
