<!--
  11 — Cases / results.

  No approved case material exists, and none may be invented
  (docs/claims-verification.md row 31). Rather than show empty frames or
  visible placeholders, the section resolves into a finished editorial
  statement: cases are real material shared with practitioners on request.

  The carousel machinery is intentionally not rendered while there is nothing
  to page through; it returns with the content.
  [CONTENT REQUIRED: approved before/after cases]
  [CONTENT REQUIRED: verified clinical outcomes]
-->
<section
  class="rv-cases"
  id="rv-cases"
  data-rv-scene="cases"
  data-rv-ground="warm"
>
  <div class="rv-scene rv-cases__scene">
    <span class="rv-blob rv-blob--morph rv-cases__blob" style="--rv-blob-tint: #edd6c2"></span>
    <span class="rv-orb rv-cases__orb" style="--rv-orb-tint: #c9a27e"></span>
    <span class="rv-arc rv-cases__arc"></span>
  </div>

  <div class="rv-shell rv-cases__grid rv-above">
    <div class="rv-cases__lead">
      <h2 class="rv-display rv-cases__title" data-rv-reveal>
        Кейсы<span class="rv-slash">/</span>результаты
      </h2>
      <p class="rv-cases__text" data-rv-reveal>
        Клинические материалы и результаты применения передаём практикующим
        специалистам по запросу — вместе с протоколами и условиями работы.
      </p>
      <a class="rv-btn rv-btn--solid rv-cases__cta" data-rv-reveal href="#rv-selection">
        Запросить материалы
      </a>
    </div>

    <figure class="rv-cases__plate" data-rv-reveal>
      <span class="rv-cases__plate-surface" aria-hidden="true"></span>
      <span class="rv-iris" aria-hidden="true"></span>
    </figure>
  </div>
</section>
